<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="gridMed" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  
  <!-- Fondo y Grid -->
  <rect width="100%" height="100%" fill="url(#gradMed)" />
  <rect width="100%" height="100%" fill="url(#gridMed)" />
  
  <!-- Icono: Electrocardiograma a Nodos -->
  <path d="M 50 100 L 120 100 L 140 60 L 180 150 L 210 70 L 230 100 L 280 100" fill="none" stroke="rgba(94, 234, 212, 0.4)" stroke-width="4" stroke-linejoin="round" />
  <circle cx="280" cy="100" r="6" fill="#5eead4" />
  <circle cx="320" cy="80" r="4" fill="#5eead4" />
  <circle cx="320" cy="120" r="4" fill="#5eead4" />
  <line x1="286" y1="98" x2="316" y2="82" stroke="#5eead4" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="286" y1="102" x2="316" y2="118" stroke="#5eead4" stroke-width="2" stroke-dasharray="3 3" />
  
  <!-- Texto -->
  <text x="200" y="170" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="4">PYTHON + DJANGO</text>
  <rect x="175" y="185" width="50" height="3" fill="#5eead4" rx="1.5" />
</svg>
