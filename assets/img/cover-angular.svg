<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradAng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="gridAng" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  
  <!-- Fondo y Grid -->
  <rect width="100%" height="100%" fill="url(#gradAng)" />
  <rect width="100%" height="100%" fill="url(#gridAng)" />
  
  <!-- Icono: Globo terráqueo abstracto -->
  <circle cx="200" cy="85" r="45" fill="none" stroke="rgba(251, 113, 133, 0.4)" stroke-width="3" />
  <ellipse cx="200" cy="85" rx="20" ry="45" fill="none" stroke="rgba(251, 113, 133, 0.4)" stroke-width="2" />
  <line x1="155" y1="85" x2="245" y2="85" stroke="rgba(251, 113, 133, 0.4)" stroke-width="2" />
  
  <!-- Nodos de ubicación -->
  <circle cx="185" cy="65" r="5" fill="#fda4af" />
  <circle cx="215" cy="110" r="4" fill="#fda4af" />
  <path d="M 185 65 Q 220 80 215 110" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Texto -->
  <text x="200" y="170" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="4">ANGULAR</text>
  <rect x="175" y="185" width="50" height="3" fill="#fda4af" rx="1.5" />
</svg>
