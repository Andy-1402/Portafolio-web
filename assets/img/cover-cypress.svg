<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.55" stop-color="#047857"/>
      <stop offset="1" stop-color="#062b26"/>
    </linearGradient>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#fondo)"/>
  <rect width="640" height="360" fill="url(#puntos)"/>

  <!-- Líneas de código estilizadas -->
