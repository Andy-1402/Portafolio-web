    <rect x="48" y="258" width="104" height="6" rx="3"/>
    <rect x="48" y="276" width="156" height="6" rx="3"/>
    <rect x="48" y="294" width="78" height="6" rx="3"/>
  </g>
  <rect x="164" y="258" width="38" height="6" rx="3" fill="#6ee7b7" fill-opacity="0.6"/>
  <rect x="136" y="294" width="46" height="6" rx="3" fill="#a7f3d0" fill-opacity="0.45"/>

  <text x="320" y="182" fill="#f0fdf4" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Roboto, system-ui, sans-serif"
        font-size="54" font-weight="700" letter-spacing="6">CYPRESS E2E</text>

  <rect x="288" y="208" width="64" height="4" rx="2" fill="#6ee7b7"/>
