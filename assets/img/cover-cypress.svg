<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCyp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="gridCyp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  
  <!-- Fondo y Grid -->
  <rect width="100%" height="100%" fill="url(#gradCyp)" />
  <rect width="100%" height="100%" fill="url(#gridCyp)" />
  
  <!-- Icono: Escudo E2E y Código -->
  <!-- Brackets -->
  <path d="M 130 65 L 110 85 L 130 105" fill="none" stroke="rgba(110, 231, 183, 0.3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 270 65 L 290 85 L 270 105" fill="none" stroke="rgba(110, 231, 183, 0.3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Escudo -->
  <path d="M 200 45 L 235 60 L 235 95 C 235 120 200 140 200 140 C 200 140 165 120 165 95 L 165 60 Z" fill="rgba(16, 185, 129, 0.2)" stroke="#6ee7b7" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Check de validación -->
  <path d="M 185 95 L 195 105 L 215 80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Texto -->
  <text x="200" y="170" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="4">CYPRESS E2E</text>
  <rect x="175" y="185" width="50" height="3" fill="#6ee7b7" rx="1.5" />
</svg>
